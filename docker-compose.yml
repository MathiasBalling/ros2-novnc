services:
  ros2:
    build: .
    command: tail -f /dev/null
    platform: linux/arm64   # or linux/amd64
    volumes: 
      - ./workspace:/root/ros2_ws/
      - /Users/balling/projects/coordinated-robot-search/:/root/coordinated-robot-search/
      - /Users/balling/dotfiles/nvim:/root/.config/nvim
      - /Users/balling/dotfiles/yazi:/root/.config/yazi
      - /Users/balling/dotfiles/small/tmux.conf:/root/.config/tmux/tmux.conf
    environment:
      - DISPLAY=novnc:0.0
      - TERM=xterm-256color
    ports:
      - "8888:8888"
    depends_on:
      - novnc
    networks:
      - x11
  novnc:  
    image: theasp/novnc:latest
    environment:
      - DISPLAY_WIDTH=1920
      - DISPLAY_HEIGHT=1080
      - RUN_XTERM=no
    ports:
      - "8080:8080"
    networks:
      - x11
networks:
  x11:
